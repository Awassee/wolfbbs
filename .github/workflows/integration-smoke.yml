name: integration-smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
      - name: Install smoke prerequisites
        run: sudo apt-get update && sudo apt-get install -y ripgrep python3-pexpect
      - name: Run acceptance smoke verifier
        run: scripts/verify.sh --smoke
      - name: Run terminal pexpect suite
        run: python3 scripts/test_tui_pexpect.py
