name: security-audit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/web/package-lock.json
      - name: Install audit prerequisites
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install web audit dependencies
        run: npm --prefix e2e/web ci
      - name: Run security audit
        run: bash scripts/security-audit.sh
