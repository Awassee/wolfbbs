name: ui-regression

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/web/package-lock.json
      - name: Install Playwright dependencies
        run: |
          npm --prefix e2e/web ci
          npx --prefix e2e/web playwright install --with-deps chromium
      - name: Run accessibility and visual regression checks
        run: |
          cd e2e/web
          npx playwright test tests/a11y_mobile.spec.js tests/visual_regression.spec.js
