name: installer-check

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate install.sh syntax
        run: bash -n install.sh
      - name: Run shellcheck
        run: shellcheck install.sh
      - name: Validate dry-run
        run: bash install.sh --dry-run --with-docker
      - name: Verify acceptance fast checks
        run: scripts/verify.sh --fast
