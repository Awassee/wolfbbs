version: '3.9'
services:
  bbs:
    build: .
    entrypoint: ["/app/wolfbbs"]
    command: ["-listen", ":2222"]
    ports:
      - "${WOLFBBS_SSH_PORT:-2222}:2222"
    environment:
      WOLFBBS_DATABASE_URL: "${WOLFBBS_DATABASE_URL}"
      WOLFBBS_DB_CONNECT_RETRIES: "15"
      WOLFBBS_DB_CONNECT_DELAY_MS: "500"
      WOLFBBS_PORT: "2222"
    depends_on:
      - postgres
  web:
    build: .
    entrypoint: ["/app/wolfbbs-web"]
    command: ["-listen", ":8080"]
    ports:
      - "${WOLFBBS_WEB_PORT:-8080}:8080"
    environment:
      WOLFBBS_DATABASE_URL: "${WOLFBBS_DATABASE_URL}"
      WOLFBBS_DB_CONNECT_RETRIES: "15"
      WOLFBBS_DB_CONNECT_DELAY_MS: "500"
    depends_on:
      - postgres
  irc:
    build: .
    entrypoint: ["/app/wolfbbs-irc"]
    command: ["-listen", ":6667"]
    ports:
      - "${WOLFBBS_IRC_PORT:-6667}:6667"
    depends_on:
      - postgres
    environment:
      WOLFBBS_DATABASE_URL: "${WOLFBBS_DATABASE_URL}"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-wolfbbs}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-wolfbbs}"
      POSTGRES_DB: "${POSTGRES_DB:-wolfbbs}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolfbbs"]
      interval: 2s
      timeout: 2s
      retries: 12
volumes:
  pgdata:
