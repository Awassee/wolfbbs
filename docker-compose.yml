version: '3.9'
services:
  bbs:
    build: .
    entrypoint: ["/app/wolfbbs"]
    command: ["-listen", ":2222"]
    ports:
      - "${WOLFBBS_SSH_PORT:-2222}:2222"
    environment:
      WOLFBBS_DATABASE_URL: "${WOLFBBS_DATABASE_URL}"
      WOLFBBS_DB_CONNECT_RETRIES: "15"
      WOLFBBS_DB_CONNECT_DELAY_MS: "500"
      WOLFBBS_PORT: "2222"
    depends_on:
      - postgres
  web:
    build: .
    entrypoint: ["/app/wolfbbs-web"]
    command: ["-listen", ":8080"]
    ports:
      - "${WOLFBBS_WEB_PORT:-8080}:8080"
    environment:
      WOLFBBS_DATABASE_URL: "${WOLFBBS_DATABASE_URL}"
      WOLFBBS_DB_CONNECT_RETRIES: "15"
      WOLFBBS_DB_CONNECT_DELAY_MS: "500"
    depends_on:
      - postgres
  irc:
    build: .
    entrypoint: ["/app/wolfbbs-irc"]
    command: ["-listen", ":6667"]
    ports:
      - "${WOLFBBS_IRC_PORT:-6667}:6667"
      - "${WOLFBBS_IRC_TLS_PORT:-6697}:6697"
    depends_on:
      - postgres
    environment:
      WOLFBBS_DATABASE_URL: "${WOLFBBS_DATABASE_URL}"
      WOLFBBS_IRC_TLS_LISTEN: "${WOLFBBS_IRC_TLS_LISTEN:-}"
      WOLFBBS_IRC_TLS_CERT: "${WOLFBBS_IRC_TLS_CERT:-}"
      WOLFBBS_IRC_TLS_KEY: "${WOLFBBS_IRC_TLS_KEY:-}"
      WOLFBBS_IRC_IP_MSG_BURST: "${WOLFBBS_IRC_IP_MSG_BURST:-20}"
      WOLFBBS_IRC_IP_MSG_WINDOW_MS: "${WOLFBBS_IRC_IP_MSG_WINDOW_MS:-2000}"
  mailin:
    build: .
    entrypoint: ["/app/wolfbbs-mailin"]
    command: ["-listen", ":8091", "-forward-url", "http://web:8080/mail/inbound"]
    ports:
      - "${WOLFBBS_MAILIN_PORT:-8091}:8091"
    environment:
      WOLFBBS_INBOUND_TOKEN: "${WOLFBBS_INBOUND_TOKEN:-dev-inbound-token}"
      WOLFBBS_MAILIN_ALLOW_DOMAINS: "${WOLFBBS_MAILIN_ALLOW_DOMAINS:-}"
    depends_on:
      - web
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-wolfbbs}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-wolfbbs}"
      POSTGRES_DB: "${POSTGRES_DB:-wolfbbs}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wolfbbs"]
      interval: 2s
      timeout: 2s
      retries: 12
volumes:
  pgdata:
